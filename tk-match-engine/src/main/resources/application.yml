spring:
  application:
    name: tk-match-engine

server:
  port: ${match.admin.port:8090}

# 仅覆盖与代码默认值不同的路径；其余 Aeron 参数见 ClusterStackConfig / MdcEgressConfig 内默认值
# cluster-members 紧凑格式：id=host:ingress:consensus:log:catchup:archive ，多节点用 | 分隔
match:
  cluster:
    archive-dir: /tmp/match-engine/node0/archive
    cluster-dir: /tmp/match-engine/node0/cluster
    aeron-dir: /tmp/aeron-match-0
  mdc:
    aeron-dir: /tmp/aeron-mdc-0

logging:
  level:
    com.tk.match: INFO
    io.aeron: WARN
    org.agrona: WARN
