# 使用外部网络 exchange，需先创建: docker network create exchange
# 启动: docker compose up -d

services:
  zookeeper:
    image: zookeeper:latest
    container_name: zookeeper
    networks:
      - exchange
    ports:
      - "2181:2181"
      - "2888:3888"
    environment:
      ZOO_CLIENT_PORT: 2181
      ZOO_TICK_TIME: 2000

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    networks:
      - exchange
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT=容器内(kafka:9092)，EXTERNAL=宿主机(localhost:9094)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s
    depends_on:
      - zookeeper

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - exchange
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy

networks:
  exchange:
    external: true
