server:
  port: 8093
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 60s
  datasource:
    url: jdbc:mysql://localhost:3306/futures
    username: root
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: futures-order-service

#mybatis
mybatis-plus:
  configuration:
    mapUnderscoreToCamelCase: true
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
logging:
  level:
    com:
      tx:
        common:
          mapper: debug

kafka:
  servers: localhost:9092
  topic: syncToDb
  groupId: sync-to-db-group

zookeeper:
  servers: 127.0.0.1:2182

trading:
  # Zookeeper 主从选举路径；多 shard 部署时请确保每个 shard 使用不同 path，避免互相抢主
  leader-latch-path: "/trading-server/leader/g1"

